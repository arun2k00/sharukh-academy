# Docker Manager project: sharukh-lms  ->  https://lms.sharukhacademy.com
#
# Follows the VPS's existing conventions: joins the shared external `edge`
# network, declares its domain with caddy labels, publishes no host ports, and
# keeps its own named volumes. The edge-proxy issues the certificate; nothing
# in the edge project is edited to add this app.
#
# Sandbox is the same file with the domain changed - see compose.sandbox.yaml.


x-app-env: &app-env
  APP_NAME: "Sharukh Academy"
  APP_ENV: production
  APP_DEBUG: "false"
  APP_KEY: "${APP_KEY}"
  APP_URL: https://lms.sharukhacademy.com
  LOG_CHANNEL: stderr
  DB_CONNECTION: mysql
  DB_HOST: db
  DB_DATABASE: sharukh
  DB_USERNAME: sharukh
  DB_PASSWORD: "${DB_PASSWORD}"
  SESSION_DRIVER: database
  SESSION_ENCRYPT: "true"
  CACHE_STORE: database
  QUEUE_CONNECTION: database
  MAIL_MAILER: smtp
  MAIL_HOST: smtp.hostinger.com
  MAIL_PORT: "465"
  MAIL_SCHEME: smtps
  MAIL_USERNAME: "${MAIL_USERNAME}"
  MAIL_PASSWORD: "${MAIL_PASSWORD}"
  MAIL_FROM_ADDRESS: "${MAIL_USERNAME}"
  ACADEMY_REQUIRE_EMAIL_VERIFICATION: "true"
  # Demo sign-in stays off: those accounts are real and own real courses.
  DEMO_LOGIN_ENABLED: "false"

services:
  app:
    image: oacer2020/sharukh-academy:latest
    pull_policy: always
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment: *app-env
    volumes:
      - storage:/app/storage
    networks: [edge, internal]
    labels:
      caddy: lms.sharukhacademy.com
      caddy.reverse_proxy: "{{upstreams 80}}"

  # Mail is queued so a slow SMTP host cannot stall a signup; this drains it.
  # entrypoint is cleared so only the app container runs migrations.
  worker:
    image: oacer2020/sharukh-academy:latest
    pull_policy: always
    restart: unless-stopped
    depends_on: [app]
    entrypoint: [""]
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    # Inherited from the image, which curls its own HTTP port; these two
    # services do not serve HTTP, so the check can only ever fail.
    healthcheck:
      disable: true
    environment: *app-env
    volumes:
      - storage:/app/storage
    networks: [internal]

  # Live-class reminders and the other scheduled commands.
  scheduler:
    image: oacer2020/sharukh-academy:latest
    pull_policy: always
    restart: unless-stopped
    depends_on: [app]
    entrypoint: [""]
    command: php artisan schedule:work
    # Inherited from the image, which curls its own HTTP port; these two
    # services do not serve HTTP, so the check can only ever fail.
    healthcheck:
      disable: true
    environment: *app-env
    volumes:
      - storage:/app/storage
    networks: [internal]

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: sharukh
      MYSQL_USER: sharukh
      MYSQL_PASSWORD: "${DB_PASSWORD}"
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [internal]

volumes:
  storage:
  db:

networks:
  edge:
    external: true
  internal:
