; Shared hosting rarely lets an app change php.ini directly, but PHP-FPM and
; CGI SAPIs both honour a .user.ini in the document root for PHP_INI_PERDIR
; directives. Values here must stay >= the largest upload allowed by
; config/academy.php (resource_max_kb = 20480 KB) or every upload past the
; PHP-level limit fails with "The :attribute failed to upload." before
; Laravel's own validation ever runs.
upload_max_filesize = 25M
post_max_size = 30M
memory_limit = 256M
max_execution_time = 60
